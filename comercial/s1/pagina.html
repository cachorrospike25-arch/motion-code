<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eb=x=>{x=clamp(x);const s=1.70158;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const PAL=['#14213d','#1b2a4e','#2a1b3d','#10343a','#14213d'];
const ACC='#ffb703',BR='#fff8e7';
// quadros: [inicio, fim]
const Q=[[0,3],[3,6],[6,9.5],[9.5,12.5],[12.5,15]];
function fundo(t,i){
  const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,PAL[i]);gr.addColorStop(1,'#0b1020');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.globalAlpha=.07;g.fillStyle=ACC;
  for(let k=0;k<7;k++){const x=((k*197+t*40*(1+k%3))%(W+300))-150,y=(k*271+Math.sin(t+k)*60)%H;g.beginPath();g.arc(x,y,60+k*18,0,7);g.fill()}
  g.globalAlpha=1;
}
function texto(s,x,y,sz,cor,a=1,sc=1,peso=900){
  g.save();g.globalAlpha=a;g.translate(x,y);g.scale(sc,sc);g.font=`${peso} ${sz}px Arial Black, Arial, sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(0,0,0,.35)';g.fillText(s,4,8);g.fillStyle=cor;g.fillText(s,0,0);g.restore();
}
function linhas(ls,t0,t,y0,sz,cor,esp,destaque=-1){
  ls.forEach((s,k)=>{const u=eb((t-t0-k*.18)/.45);texto(s,W/2,y0+k*esp,sz,k===destaque?ACC:cor,clamp((t-t0-k*.18)/.2),Math.max(.01,u))})
}
function barra(t,q){const u=clamp((t-Q[q][0])/(Q[q][1]-Q[q][0]));g.fillStyle='rgba(255,255,255,.18)';g.fillRect(60,70,W-120,8);g.fillStyle=ACC;g.fillRect(60,70,(W-120)*((q+u)/5),8)}
function icone(t,q,x,y){ // desenhos simples por quadro
  g.save();g.translate(x,y);
  const s=.9+.05*Math.sin(t*4);g.scale(s,s);g.lineWidth=14;g.strokeStyle=ACC;g.fillStyle=ACC;g.lineCap='round';
  if(q===0){ // celular parado com cadeado de poeira
    g.strokeRect(-110,-190,220,380);g.beginPath();g.arc(0,150,16,0,7);g.stroke();
    g.font='bold 90px Arial';g.textAlign='center';g.fillStyle=ACC;g.fillText('Zzz',0,-20);
  }else if(q===1){ // olho
    g.beginPath();g.ellipse(0,0,190,100,0,0,7);g.stroke();g.beginPath();g.arc(Math.sin(t*3)*40,0,54,0,7);g.fill();
  }else if(q===2){ // claquete/play
    g.strokeRect(-190,-130,380,260);g.beginPath();g.moveTo(-40,-60);g.lineTo(80,0);g.lineTo(-40,60);g.closePath();g.fill();
  }else if(q===3){ // presente
    g.strokeRect(-130,-60,260,190);g.strokeRect(-150,-120,300,60);g.beginPath();g.moveTo(0,-120);g.lineTo(0,130);g.stroke();
    g.beginPath();g.arc(-50,-150,40,0,7);g.arc(50,-150,40,0,7);g.stroke();
  }
  g.restore();
}
function cena(t,q){
  const tl=t-Q[q][0];fundo(t,q);barra(t,q);
  if(q<4)icone(t,q,W/2,560);
  if(q===0){linhas(['Seu Instagram','está parado?'],0.1,tl+.1,1060,128,BR,150,1)}
  if(q===1){linhas(['Cliente olha o','perfil antes','de comprar.'],0,tl,1010,104,BR,135,2)}
  if(q===2){linhas(['Eu faço vídeo','animado de 30 s','para o seu negócio.'],0,tl,1010,96,BR,130,1)}
  if(q===3){linhas(['Primeiro teste','de 15 s:','GRÁTIS.'],0,tl,1010,118,BR,150,2)}
  if(q===4){
    texto('Chama no',W/2,700,110,BR,clamp(tl/.3),eb(tl/.5));
    texto('WhatsApp',W/2,830,150,ACC,clamp((tl-.15)/.3),eb((tl-.15)/.5));
    const p=1+.05*Math.sin(tl*7);g.save();g.translate(W/2,1130);g.scale(p*eb((tl-.5)/.5),p*eb((tl-.5)/.5));
    g.fillStyle=ACC;g.beginPath();g.roundRect(-380,-90,760,180,90);g.fill();
    g.font='900 72px Arial Black, Arial';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#14213d';g.fillText('QUERO O TESTE',0,4);g.restore();
    texto('link na bio  ➜',W/2,1380,64,BR,clamp((tl-1)/.3));
    texto('Segue o perfil  ➕',W/2,1500,60,ACC,clamp((tl-1.4)/.3));
  }
}
function quadro(t){
  let q=Q.findIndex(([a,b])=>t>=a&&t<b);if(q<0)q=4;
  cena(t,q);
  // fade de saída/entrada entre quadros
  const tl=t-Q[q][0];if(tl<.12&&q>0){g.fillStyle='rgba(11,16,32,'+(1-tl/.12)+')';g.fillRect(0,0,W,H)}
}
window.quadro=quadro;
</script></body></html>
